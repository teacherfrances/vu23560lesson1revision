function range(n){ var a = []; for(var i = 0; i < n; i++) a.push(i); return a; }

if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function isTarget(T, id){ if(T.target instanceof Array) return T.target.indexOf(id) > -1; return T.target === id; }

function simTap(P, id, label){
  var st = stepOf(P);
  if(st >= P.tasks.length) return;
  var seq = taskSeq(P), ti = seq[st], T = P.tasks[ti], key = P.id + "t" + ti;
  if(T.type === "type"){
    var typed = S.typed[P.id] || (S.typed[P.id] = []);
    var want = T.seq[typed.length];
    if(id === "k:" + want){
      typed.push(want);
      if(typed.length === T.seq.length){
        if(!S.ans[key]) S.ans[key] = {ok:true, pick:"www.cammeraygreenpool.com.au"};
        S.step[P.id] = st + 1; S.fb[P.id] = {ok:true, msg:T.why};
      } else S.fb[P.id] = {ok:true, msg:"Good. Keep going."};
      FLASH = {id:id, ok:true};
    } else {
      if(!S.ans[key]) S.ans[key] = {ok:false, pick:(typed.join("") + label.replace("the key ", "")) + " ..."};
      S.fb[P.id] = {ok:false, msg:id === "enter" ? "Finish the address first." : "Not this part. Look at the address again."};
      FLASH = {id:id, ok:false};
    }
    save(true); renderKeep(); return;
  }
  if(isTarget(T, id)){
    if(!S.ans[key]) S.ans[key] = {ok:true, pick:label};
    S.step[P.id] = st + 1; S.fb[P.id] = {ok:true, msg:T.why}; FLASH = {id:id, ok:true};
    if(P.sim === "search" && st + 1 === P.tasks.length){ LOADT = Date.now(); }
  } else {
    if(!S.ans[key]) S.ans[key] = {ok:false, pick:label};
    S.fb[P.id] = {ok:false, msg:"That is " + label + ". Try again."}; FLASH = {id:id, ok:false};

  save(true); renderKeep();
  if(LOADT && P.sim === "search"){ setTimeout(function(){ LOADT = null; if(S.v === "part" && PARTS[S.p] === P) renderKeep(); }, 1100); }
}
